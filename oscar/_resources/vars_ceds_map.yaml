# ==============================================================================
# OSCAR CEDS/RESCUE TRANSLATION REGISTRY (Wide Format)
# ==============================================================================
# Units in source: Mt for main species | kt for halogens
# Target units: PgC, TgN, TgS, Tg species, Gg species
# ==============================================================================

# 1. Standard Emissions (Regional)
# Format: "CEDS_Variable": ["OSCAR_ID", "Calculation"]
emissions:
  "CEDS+|9+ Sectors|Emissions|CO2|Total": ["Eff", "(12.011 / 44.009) / 1000"]
  "CEDS+|9+ Sectors|Emissions|CH4|Total": ["E_CH4", "12.011 / 16.043"]
  "CEDS+|9+ Sectors|Emissions|N2O|Total": ["E_N2O", "28.014 / 44.013"]
  "CEDS+|9+ Sectors|Emissions|NOx|Total": ["E_NOX", "14.007 / 46.005"]
  "CEDS+|9+ Sectors|Emissions|SO2|Total": ["E_SO2", "32.06 / 64.06"]
  "CEDS+|9+ Sectors|Emissions|NH3|Total": ["E_NH3", "14.007 / 17.031"]
  "CEDS+|9+ Sectors|Emissions|VOC|Total": ["E_VOC", "1.0"]
  "CEDS+|9+ Sectors|Emissions|BC|Total":  ["E_BC", "1.0"]
  "CEDS+|9+ Sectors|Emissions|OC|Total":  ["E_OC", "1.0"]
  "CEDS+|9+ Sectors|Emissions|CO|Total":  ["E_CO", "1.0"]

# 2. Halogenated Species (Global)
# Format: "CEDS_Variable": ["E_Xhalo", "OSCAR_SPEC_ID", "Multiplier"]
# Multiplier: 1.0 because kt (CEDS) = Gg (OSCAR)
